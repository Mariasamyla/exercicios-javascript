<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ex 5 -Conversor de Temperatura</title>
</head>
<body>
    <h1>Conversor de Temperatura</h1>
    
    <input type="number" id="celsius" placeholder="Digite °C">
    <button onclick="converter()">Converter</button>
    
    <p id="resultado"></p>

    <script>
        function converter() {
            let celsius = Number(document.getElementById('celsius').value);
            let fahrenheit = (celsius * 9/5) + 32;
            document.getElementById('resultado').innerHTML = celsius + "°C = " + fahrenheit + "°F";
        }
    </script>
</body>
</html>
